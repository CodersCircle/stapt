name: Release STAPT

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            asset_dmg: STAPT-macOS-arm64.dmg
          - os: macos-13
            goos: darwin
            goarch: amd64
            asset_dmg: STAPT-macOS-amd64.dmg
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_exe: STAPT-Windows-x64.exe
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            asset_tgz: STAPT-Linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Wails (macOS)
        if: runner.os == 'macOS'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Wails (Windows)
        if: runner.os == 'Windows'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Wails (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -platform ${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Package macOS DMG
        if: matrix.asset_dmg != ''
        run: |
          mkdir -p dist
          hdiutil create -volname STAPT -srcfolder build/bin/STAPT.app -ov -format UDZO "dist/${{ matrix.asset_dmg }}"

      - name: Package Windows installer
        if: matrix.asset_exe != ''
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/STAPT.exe "dist/${{ matrix.asset_exe }}"

      - name: Package Linux tarball
        if: matrix.asset_tgz != ''
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset_tgz }}" -C build/bin STAPT

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
